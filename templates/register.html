{% extends "base.html" %}

{% block title %}Create Account | Project After Life{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 30px auto;">
    <div class="glass-panel" style="padding: 36px 32px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2 style="font-size: 1.7rem;">Create Your Account</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px;">
                Join the platform reviving innovative student hackathon projects
            </p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <!-- Role Selection -->
            <div class="form-group">
                <label class="form-label">I am joining as a:</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <label style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: var(--radius-md); cursor: pointer;">
                        <input type="radio" name="role" value="student" checked style="accent-color: var(--primary);">
                        <div>
                            <strong style="display: block; font-size: 0.95rem; color: #fff;"><i class="fa-solid fa-graduation-cap"></i> Student Innovator</strong>
                            <small style="color: var(--text-muted); font-size: 0.78rem;">Showcase unfunded hackathon projects</small>
                        </div>
                    </label>

                    <label style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: var(--radius-md); cursor: pointer;">
                        <input type="radio" name="role" value="company" style="accent-color: var(--secondary);">
                        <div>
                            <strong style="display: block; font-size: 0.95rem; color: #fff;"><i class="fa-solid fa-building"></i> Company / Expert</strong>
                            <small style="color: var(--text-muted); font-size: 0.78rem;">Discover, evaluate & fund talent</small>
                        </div>
                    </label>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="name">Full Name *</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Aarav Sharma" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address *</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@domain.com" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="organization">College / Company Name *</label>
                    <input type="text" id="organization" name="organization" class="form-control" placeholder="e.g. IIT Madras or TechCorp Inc." required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="department">Department / Role *</label>
                    <input type="text" id="department" name="department" class="form-control" placeholder="e.g. Computer Science or R&D Lead" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="contact_phone">Contact Phone</label>
                    <input type="text" id="contact_phone" name="contact_phone" class="form-control" placeholder="+91 98765 43210">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password *</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="bio">Short Bio / Background</label>
                <textarea id="bio" name="bio" class="form-control" style="min-height: 80px;" placeholder="Tell us about your technical focus, hackathons participated in, or corporate scouting mandate..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                <i class="fa-solid fa-user-plus"></i> Create Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-secondary);">
            Already have an account? 
            <a href="{{ url_for('login') }}" style="color: var(--secondary); font-weight: 600;">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
